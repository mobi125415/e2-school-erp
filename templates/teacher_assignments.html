{% extends "base.html" %}{% block body %}
<div class="page-head"><h1>Teacher Assignments</h1><p>Assign classes and subjects to teacher login accounts.</p></div>
<form method="post" class="panel form-grid"><label>Teacher<select name="teacher_user_id" required>{% for t in teachers %}<option value="{{t.id}}">{{t.email}}</option>{% endfor %}</select></label><label>Class<select name="class_name" required>{% for c in classes %}<option>{{c}}</option>{% endfor %}</select></label><label>Subject<input name="subject" placeholder="e.g. Mathematics"></label><button class="btn" type="submit">Assign Teacher</button></form>
<div class="panel"><table><tr><th>Teacher</th><th>Class</th><th>Subject</th><th>Action</th></tr>{% for a in rows %}<tr><td>{{a.teacher.email}}</td><td>{{a.class_name}}</td><td>{{a.subject}}</td><td><form method="post" action="{{url_for('teacher_assignment_delete',aid=a.id)}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
