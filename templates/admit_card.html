{% extends "base.html" %}{% block body %}<div class="page-head"><h1>Admit Card Generator</h1><p>Select exam and student to generate an official examination admit card.</p></div><section class="tool-panel"><form method="get" action="/admit-card.pdf" class="generator-bar" target="_blank"><label>Exam<select name="exam_id" required><option value="">Select Exam</option>{% for e in exams %}<option value="{{e.id}}">{{e.name}} — {{e.class_name}}</option>{% endfor %}</select></label><label>Student<select name="student_id" required><option value="">Select Student</option>{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}} — {{s.admission_no}}</option>{% endfor %}</select></label><button>Generate Admit Card PDF</button></form></section>{% endblock %}
