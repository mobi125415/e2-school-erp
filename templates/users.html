{% extends "base.html" %}{% block body %}<div class="page-head"><h1>Users & Roles</h1><p>Create separate login accounts for school staff.</p></div><section class="tool-panel"><form method="post" class="form grid"><input name="email" type="email" placeholder="Login Email" required><input name="password" type="password" placeholder="Password" required><select name="role"><option value="teacher">Teacher</option><option value="accountant">Accountant</option><option value="staff">Staff</option><option value="school_admin">Administrator</option></select><button>Create User</button></form></section><div class="table"><table><tr><th>Email</th><th>Role</th><th>Reset Password</th><th>Delete</th></tr>{% for u in users %}<tr><td>{{u.email}}</td><td>{{u.role}}</td><td><form method="post" action="/users/{{u.id}}/password" class="inline"><input name="password" placeholder="New password" required><button>Update</button></form></td><td><form method="post" action="/users/{{u.id}}/delete" onsubmit="return confirm('Delete this user?')"><button class="dangerbtn">Delete</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
