<!doctype html><html><head><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>E-2 Sign In</title></head><body class="e2-login-page"><div class="e2-login-shell"><section class="e2-brand-panel"><div class="e2-orb">E-2</div><div class="e2-brand-copy"><h1>E-2 <span>Solutions</span></h1><p>Secure access for Super Admin, School Admin & Student</p></div></section><section class="e2-login-panel"><div class="e2-login-form"><h2>Sign In</h2>{% with m=get_flashed_messages(with_categories=true) %}{% for c,x in m %}<div class="flash {{c}}">{{x}}</div>{% endfor %}{% endwith %}<div style="display:flex;gap:10px"><button onclick="sw('a')">Administrator</button><button onclick="sw('s')">Student</button></div><form method="post" id="a"><input type="hidden" name="login_type" value="admin"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button>Login as Administrator</button><div class="login-hint">School Admin uses the email + password created by Super Admin in the Institute Control Center.</div></form><form method="post" id="s" style="display:none"><input type="hidden" name="login_type" value="student"><label>Institute Email<input type="email" name="institute_email" required></label><label>Admission No.<input name="admission_no" required></label><label>Password<input type="password" name="password" required></label><button>Login as Student</button></form></div></section></div><script>function sw(x){a.style.display=x=='a'?'block':'none';s.style.display=x=='s'?'block':'none'}</script></body></html>
