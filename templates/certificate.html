{% extends "base.html" %}{% block body %}<div class="page-head"><h1>Certificate Generator</h1><p>Create branded professional student certificates.</p></div><section class="tool-panel"><form method="post" action="/certificate.pdf" class="form grid" target="_blank"><select name="student_id" required><option value="">Select Student</option>{% for s in students %}<option value="{{s.id}}">{{s.name}} — {{s.class_name}} — {{s.admission_no}}</option>{% endfor %}</select><input name="title" value="Certificate of Achievement" placeholder="Certificate Title"><textarea name="body" placeholder="Certificate statement">This certificate is proudly presented in recognition of excellent performance and conduct.</textarea><button>Generate Certificate PDF</button></form></section>{% endblock %}
