{% extends "base.html" %}{% block body %}<div class="page-head"><h1>{{'Edit Teacher' if t else 'Add Teacher'}}</h1><p>Personal, academic, employment and login details.</p></div><form method="post" enctype="multipart/form-data" class="panel form-grid">
<label>Employee No.<input name="employee_no" value="{{t.employee_no if t else ''}}" required></label><label>Full Name<input name="full_name" value="{{t.full_name if t else ''}}" required></label><label>Father / Husband<input name="father_husband_name" value="{{t.father_husband_name if t else ''}}"></label><label>CNIC<input name="cnic" value="{{t.cnic if t else ''}}"></label><label>Gender<select name="gender"><option>{{t.gender if t else ''}}</option><option>Male</option><option>Female</option></select></label><label>DOB<input type="date" name="dob" value="{{t.dob.isoformat() if t and t.dob else ''}}"></label>
<label>Phone<input name="phone" value="{{t.phone if t else ''}}"></label><label>WhatsApp<input name="whatsapp" value="{{t.whatsapp if t else ''}}"></label><label>Email / Login<input type="email" name="email" value="{{t.email if t else ''}}" required></label><label>{{'New Password (optional)' if t else 'Login Password'}}<input type="password" name="password" {{'' if t else 'required'}}></label>
<label>Joining Date<input type="date" name="joining_date" value="{{t.joining_date.isoformat() if t and t.joining_date else ''}}"></label><label>Designation<input name="designation" value="{{t.designation if t else 'Teacher'}}"></label><label>Qualification / Degree<input name="qualification" value="{{t.qualification if t else ''}}"></label><label>University / Board<input name="university" value="{{t.university if t else ''}}"></label><label>Specialization / Subject<input name="specialization" value="{{t.specialization if t else ''}}"></label><label>Experience<input name="experience" value="{{t.experience if t else ''}}"></label>
<label>Monthly Salary<input type="number" step="0.01" name="monthly_salary" value="{{t.monthly_salary if t else 0}}"></label><label>Emergency Contact<input name="emergency_contact" value="{{t.emergency_contact if t else ''}}"></label><label>Status<select name="status"><option>{{t.status if t else 'Active'}}</option><option>Active</option><option>Inactive</option></select></label><label>Teacher Photo<input type="file" name="photo" accept="image/*"></label><label class="wide">Address<textarea name="address" rows="3">{{t.address if t else ''}}</textarea></label><label class="wide">Remarks<textarea name="remarks" rows="3">{{t.remarks if t else ''}}</textarea></label><button class="btn" type="submit">{{'Update Teacher' if t else 'Create Teacher + Login'}}</button></form>{% endblock %}
