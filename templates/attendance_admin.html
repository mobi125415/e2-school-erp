{% extends "base.html" %}{% block body %}<div class="page-head"><h1>Student Attendance</h1><p>Administrator-only attendance control.</p></div><form method="get" class="panel"><select name="class_name"><option>Select Class</option>{% for c in classes %}<option {{'selected' if c==selected_class}}>{{c}}</option>{% endfor %}</select><input type="date" name="attendance_date" value="{{attendance_date}}"><button class="btn">Load</button></form>{% if selected_class %}<form method="post" class="panel"><input type="hidden" name="class_name" value="{{selected_class}}"><input type="hidden" name="attendance_date" value="{{attendance_date}}"><table><tr><th>Admission</th><th>Name</th><th>Status</th></tr>{% for s in students %}<tr><td>{{s.admission_no}}</td><td>{{s.name}}</td><td><select name="status_{{s.id}}">{% for z in ['Present','Absent','Leave','Late'] %}<option {{'selected' if existing.get(s.id,'Present')==z}}>{{z}}</option>{% endfor %}</select></td></tr>{% endfor %}</table><button class="btn">Save Attendance</button></form>{% endif %}{% endblock %}
